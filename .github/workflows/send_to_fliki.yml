name: Send Script to Fliki

on:
  workflow_dispatch:
    inputs:
      payload_file:
        description: 'Path to JSON payload file in the repo'
        required: true
        default: 'data/fliki_audrey_soldier.json'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate payload JSON
        run: python3 -c "import json; json.load(open('${{ github.event.inputs.payload_file }}', encoding='utf-8')); print('payload JSON gecerli')"

      - name: Send payload to Fliki API
        env:
          FLIKI_API_KEY: ${{ secrets.FLIKI_API_KEY }}
        run: |
          if [ -z "$FLIKI_API_KEY" ]; then
            echo "FLIKI_API_KEY secret ayarlanmamis" >&2
            exit 1
          fi
          curl -sS -X POST "https://api.fliki.ai/v1/generate/template" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $FLIKI_API_KEY" \
            --data @"${{ github.event.inputs.payload_file }}"
